services:

  api:
    build: .
    container_name: project8-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: project8-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dragon123
      POSTGRES_DB: game_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
